  <line x1="484" y1="130" x2="492" y2="130" stroke="#0B3C2D" stroke-width="1.5" opacity="0.3"/>
  <line x1="484" y1="145" x2="492" y2="145" stroke="#0B3C2D" stroke-width="1.5" opacity="0.3"/>
  <line x1="484" y1="160" x2="492" y2="160" stroke="#0B3C2D" stroke-width="1.5" opacity="0.3"/>
  <line x1="484" y1="175" x2="492" y2="175" stroke="#0B3C2D" stroke-width="1.5" opacity="0.3"/>
  <line x1="484" y1="190" x2="492" y2="190" stroke="#0B3C2D" stroke-width="1.5" opacity="0.3"/>
